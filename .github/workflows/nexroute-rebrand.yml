name: Complete Nexroute rebrand

on:
  push:
    paths:
      - '.github/workflows/nexroute-rebrand.yml'

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Rename Forkop internals to Nexroute
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          root = Path('.')
          tracked = subprocess.check_output(
              ['git', 'ls-files', '-z']
          ).decode().split('\0')
          tracked = [p for p in tracked if p]

          replacements = [
              ('https://raw.githubusercontent.com/ushan0v/forkop', 'https://raw.githubusercontent.com/filippxda26/Nexroute'),
              ('raw.githubusercontent.com/ushan0v/forkop', 'raw.githubusercontent.com/filippxda26/Nexroute'),
              ('https://github.com/ushan0v/forkop', 'https://github.com/filippxda26/Nexroute'),
              ('github.com/ushan0v/forkop', 'github.com/filippxda26/Nexroute'),
              ('ushan0v/forkop', 'filippxda26/Nexroute'),
              ('https://forkop.sourceforge.io', 'https://raw.githubusercontent.com/filippxda26/Nexroute/main'),
              ('https://t.me/forkop_chat', 'https://github.com/filippxda26/Nexroute'),
              ('https://t.me/forkop_aibot', 'https://github.com/filippxda26/Nexroute'),
              ('ushan0v <ushan0v@users.noreply.github.com>', 'filippxda26 <filippxda26@users.noreply.github.com>'),
              ('ushan0v@users.noreply.github.com', 'filippxda26@users.noreply.github.com'),
              ('FORKOP', 'NEXROUTE'),
              ('Forkop', 'Nexroute'),
              ('forkop', 'nexroute'),
          ]

          for rel in tracked:
              if rel in {'README.md', 'LICENSE'}:
                  continue
              path = root / rel
              try:
                  data = path.read_bytes()
              except FileNotFoundError:
                  continue
              if b'\0' in data:
                  continue
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, replacement in replacements:
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8', newline='')

          workflow = Path('.github/workflows/backend-ci.yml')
          if workflow.exists():
              text = workflow.read_text(encoding='utf-8')
              text = re.sub(
                  r"\n      - name: Create compatibility paths for tests\n"
                  r"        shell: bash\n"
                  r"        run: \|\n"
                  r"(?:          .*\n)+?"
                  r"(?=\n      - name: Run backend tests)",
                  "\n",
                  text,
              )
              workflow.write_text(text, encoding='utf-8', newline='')

          original_paths = subprocess.check_output(
              ['git', 'ls-files', '-z']
          ).decode().split('\0')
          original_paths = [p for p in original_paths if p]

          def rename_path(p: str) -> str:
              return p.replace('FORKOP', 'NEXROUTE').replace('Forkop', 'Nexroute').replace('forkop', 'nexroute')

          for rel in sorted(original_paths, key=lambda p: (p.count('/'), len(p)), reverse=True):
              new_rel = rename_path(rel)
              if new_rel == rel:
                  continue
              src = Path(rel)
              if not src.exists():
                  continue
              dst = Path(new_rel)
              dst.parent.mkdir(parents=True, exist_ok=True)
              subprocess.check_call(['git', 'mv', rel, new_rel])

          # Keep upstream attribution in README while Nexroute itself is fully renamed.
          readme = Path('README.md')
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              text = text.replace(
                  '[Nexroute](https://github.com/filippxda26/Nexroute), основанного на [Podkop]',
                  '[Forkop](https://github.com/ushan0v/forkop), основанного на [Podkop]'
              )
              text = text.replace(
                  'Nexroute создан на основе [Nexroute](https://github.com/filippxda26/Nexroute)',
                  'Nexroute создан на основе [Forkop](https://github.com/ushan0v/forkop)'
              )
              readme.write_text(text, encoding='utf-8', newline='')
          PY

      - name: Commit rebrand
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/nexroute-rebrand.yml
          git add -A
          git status --short
          git commit -m "Complete Nexroute rebrand"
          git push
